{% load static %}
<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imprimir Receta {{ receta.numero_receta }} | Farmacia Asistencial CESFAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/cesfam.css' %}?v=20261123v4">
    <style>
        body {
            background-color: #E2E8F0;
            color: #18181B;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
        }
        .print-toolbar {
            background-color: #18181B;
            color: #FFFFFF;
            padding: 0.65rem 1.25rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }
        .hoja-impresion-wrapper {
            max-width: 860px;
            margin: 1.5rem auto 2.5rem;
            background-color: #FFFFFF;
            padding: 2rem 2.25rem;
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
            border: 1px solid #CBD5E1;
        }
        @page {
            size: letter portrait;
            margin: 12mm;
        }
        @media print {
            html, body {
                background-color: #FFFFFF !important;
                margin: 0 !important;
                padding: 0 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .print-toolbar, .no-print {
                display: none !important;
            }
            .hoja-impresion-wrapper {
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                border-radius: 0 !important;
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body>
    <!-- Barra de acciones exclusiva en pantalla (oculta al imprimir) -->
    <div class="print-toolbar no-print">
        <div class="container-fluid d-flex flex-wrap justify-content-between align-items-center gap-2" style="max-width: 860px;">
            <div class="d-flex align-items-center gap-2 small">
                <i class="bi bi-file-earmark-medical-fill text-danger fs-5"></i>
                <span class="fw-bold">Vista de Impresión — Documento de Receta Médica ({{ receta.numero_receta }})</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a href="{% url 'dispensacion:receta_detalle' receta.pk %}" class="btn btn-outline-light btn-sm" id="btnVolverImpresion">
                    <i class="bi bi-arrow-left me-1"></i>Volver a Ficha
                </a>
                <button type="button" class="btn btn-cesfam btn-sm fw-bold" onclick="window.print()">
                    <i class="bi bi-printer-fill me-1"></i>Imprimir Receta
                </button>
            </div>
        </div>
    </div>

    <!-- Hoja Formal Única de Impresión -->
    <main class="hoja-impresion-wrapper">
        {% include 'dispensacion/_documento_receta_formal.html' %}
    </main>

    <script>
        (function () {
            var btnVolver = document.getElementById('btnVolverImpresion');
            if (btnVolver && window.opener && !window.opener.closed) {
                btnVolver.innerHTML = '<i class="bi bi-x-lg me-1"></i>Cerrar Ventana';
                btnVolver.addEventListener('click', function (ev) {
                    ev.preventDefault();
                    window.close();
                });
            }
            {% if autoprint %}
            window.addEventListener('load', function () {
                setTimeout(function () {
                    window.print();
                }, 250);
            });
            {% endif %}
        })();
    </script>
</body>
</html>
